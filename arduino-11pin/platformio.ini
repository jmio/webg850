; PlatformIO project - PC-G850 11pin I/O bridge
;
; ボード: Arduino Uno R4 Minima (Renesas RA4M1 / 48MHz / 5V ロジック)
; 5V ロジックであることが重要。実機の 11pin は 5V TTL なのでレベル変換なしに
; つなげる。3.3V のボードに置き換えるときは変換を挟むこと。

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino

monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes

build_flags =
	-Wall
	-Wextra
