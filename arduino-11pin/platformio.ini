; PlatformIO project - PC-G850 11pin I/O bridge
;
; ボード: Arduino Uno R4 (Renesas RA4M1 / 48MHz / 5V ロジック)
; 5V ロジックであることが重要。実機の 11pin は 5V TTL なのでレベル変換なしに
; つなげる。3.3V のボードに置き換えるときは変換を挟むこと。
;
; 既定は Minima。`-e uno_r4_wifi` で WiFi 版も作れる。

[env]
platform = renesas-ra
framework = arduino

monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes

build_flags =
	-Wall
	-Wextra

[env:uno_r4_minima]
board = uno_r4_minima

; 2 台目用（1 台が送出、もう 1 台が取り込みで、ポケコン抜きの往復を見るため）。
;
; 主 MCU は Minima と同じ RA4M1 なので、タイミング定数もピン割り当てもそのまま。
;
; **Serial の実体が違う可能性がある。** R4 WiFi は USB-C の先に ESP32-S3 が
; 載っており、Serial が RA4M1 のネイティブ USB なのか ESP32 経由の UART なのかで、
; 送出中に止めるべき割り込みが変わる（USB の 0x31-0x34 か、SCI か）。
; 書き込んだら `IRQ` コマンドで確かめること。**usb の印が付かなければ
; usbmask は空振りしている。**
[env:uno_r4_wifi]
board = uno_r4_wifi
